[env:esp32-c6-gateway]
; TOTO JE KĽÚČOVÉ: Používame komunitnú verziu s podporou pre C6
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip

; Definícia dosky
board = esp32-c6-devkitc-1
framework = arduino

; Rýchlosť
monitor_speed = 115200
upload_speed = 921600

; Nastavenia pre USB (aby fungoval Serial Monitor cez USB-C)
build_flags = 
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1